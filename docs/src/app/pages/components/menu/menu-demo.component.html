<app-page-header
  title="Menu"
  description="Menu component for actions and navigation options, standalone or inside a dropdown.">
</app-page-header>

<div class="space-y-8">
  <!-- Basic: menu inside a dropdown -->
  <app-demo-section title="Dropdown Menu" [code]="basicCode">
    <tw-dropdown>
      <tw-button twDropdownTrigger variant="outline">Actions</tw-button>
      <tw-dropdown-menu>
        <tw-menu [items]="menuItems"></tw-menu>
      </tw-dropdown-menu>
    </tw-dropdown>
  </app-demo-section>

  <!-- With Shortcuts -->
  <app-demo-section title="Menu Items" [code]="fileMenuCode">
    <div class="max-w-xs">
      <tw-menu [items]="fileMenuItems"></tw-menu>
    </div>
  </app-demo-section>

  <!-- Grouped Menu -->
  <app-demo-section title="Grouped Menu" [code]="groupsCode">
    <div class="max-w-xs">
      <tw-menu [items]="groupedMenuItems"></tw-menu>
    </div>
  </app-demo-section>

  <!-- Menu with Disabled Items -->
  <app-demo-section title="Disabled Items" [code]="disabledCode">
    <div class="max-w-xs">
      <tw-menu [items]="editMenuItems"></tw-menu>
    </div>
  </app-demo-section>
</div>
