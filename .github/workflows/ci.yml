name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # pnpm 11 requires Node >= 22.13 (it loads node:sqlite)
        node-version: [22.x, 24.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      # Install only root/library dependencies (exclude docs which needs built library)
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter "!docs"

      - name: Build library
        run: pnpm run build

      - name: Run tests
        run: pnpm run test:run

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        if: matrix.node-version == '22.x'
        with:
          name: dist
          path: dist/
          retention-days: 7

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: 'pnpm'

      # Install only root/library dependencies (exclude docs which needs built library)
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter "!docs"

      - name: Check formatting
        run: pnpm run format:check

      - name: Run lint
        run: pnpm run lint

  # Build-verify only. Deployment to GitHub Pages happens exclusively via
  # release.yml's configure-pages/deploy-pages route.
  docs-build-only:
    name: Build Docs
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: 'pnpm'

      # Install only root/library dependencies first
      - name: Install root dependencies
        run: pnpm install --frozen-lockfile --filter "!docs"

      - name: Build library
        run: pnpm run build

      # Now install docs dependencies (library dist exists)
      - name: Install docs dependencies
        run: cd docs && pnpm install --frozen-lockfile

      - name: Build docs
        run: cd docs && pnpm run build --configuration github-pages

      - name: Upload docs artifacts
        uses: actions/upload-artifact@v7
        with:
          name: docs
          path: docs/dist/
          retention-days: 7
