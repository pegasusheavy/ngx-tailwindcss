packages:
  - docs

# ponytail: angular-eslint 22 resolves a stale @typescript-eslint/utils 8.50.0
# that references FlatESLint (removed in ESLint 10), crashing the lint run. Pin
# it to an ESLint-10-compatible version. Drop when angular-eslint dedupes to
# >=8.62 on its own.
overrides:
  '@typescript-eslint/utils': '8.62.0'

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  less: true
  lmdb: true
  msgpackr-extract: true

onlyBuiltDependencies:
  - '@parcel/watcher'
  - electron
  - esbuild
  - less
  - lmdb
  - msgpackr-extract

minimumReleaseAgeExclude:
  - prettier@3.9.3
