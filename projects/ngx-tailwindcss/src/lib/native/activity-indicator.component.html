<div [class]="containerClasses()" role="status" [attr.aria-label]="label() || 'Loading'">
  @switch (variant()) {
    @case ('spinner') {
      <svg
        [class]="sizeClasses()"
        class="animate-spin"
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
      >
        <circle
          class="opacity-25"
          cx="12"
          cy="12"
          r="10"
          stroke="currentColor"
          stroke-width="4"
        ></circle>
        <path
          class="opacity-75"
          fill="currentColor"
          d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
        ></path>
      </svg>
    }
    @case ('dots') {
      <div class="flex gap-1">
        @for (dot of [0, 1, 2]; track dot) {
          <div
            [class]="dotSizeClasses()"
            class="rounded-full bg-current animate-bounce"
            [style.animation-delay]="dot * 150 + 'ms'"
          ></div>
        }
      </div>
    }
    @case ('pulse') {
      <div [class]="sizeClasses()" class="rounded-full bg-current animate-pulse"></div>
    }
    @case ('bars') {
      <div class="flex items-end gap-0.5">
        @for (bar of [0, 1, 2, 3]; track bar) {
          <div
            [class]="barClasses(bar)"
            class="bg-current rounded-sm animate-pulse"
            [style.animation-delay]="bar * 100 + 'ms'"
          ></div>
        }
      </div>
    }
    @case ('ring') {
      <div
        [class]="sizeClasses()"
        class="rounded-full border-2 border-current border-t-transparent animate-spin"
      ></div>
    }
  }

  @if (label()) {
    <span [class]="labelClasses()">{{ label() }}</span>
  }
</div>
