<div [class]="containerClasses()" [ngStyle]="cssVarStyles()">
  <canvas
    #spectrumCanvas
    [width]="effectiveWidth()"
    [height]="effectiveHeight()"
    class="block rounded"
    role="img"
    aria-label="Audio spectrum analyzer"
  ></canvas>

  <!-- Frequency Labels -->
  @if (showLabels()) {
    <div
      class="flex justify-between px-1 mt-1 text-[9px] text-slate-500 dark:text-slate-400 font-mono"
    >
      @for (label of frequencyLabels(); track label) {
        <span>{{ label }}</span>
      }
    </div>
  }
</div>
